      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/gateway/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.routers.paygateway.rule=PathPrefix(`/v1/gateway`)
      - traefik.http.routers.paygateway.entrypoints=web
      - traefik.http.routers.paygateway.priority=20
      - traefik.http.services.paygateway.loadbalancer.server.port=8080
    networks:
      - facinect_internal
    restart: unless-stopped


  platform:
    build:
      context: ./services/platform
      dockerfile: Dockerfile
    container_name: facinect-platform
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_IDENTITY_DB}
      DB_USER: ${POSTGRES_IDENTITY_USER}
      DB_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-}
      PAYGATEWAY_URL: ${PAYGATEWAY_URL:-http://paygateway:8080}
      PAYGATEWAY_SERVICE_KEY: ${PAYGATEWAY_SERVICE_KEY:-}
      NOTIFICATIONS_BASE_URL: http://notifications:8080
      NOTIFICATIONS_SERVICE_KEY: ${NOTIFICATIONS_SERVICE_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cloud.facinect.com}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      paygateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/platform/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.services.platform.loadbalancer.server.port=8080
      - traefik.http.routers.platform.rule=PathPrefix(`/v1/platform`)
      - traefik.http.routers.platform.entrypoints=web
      - traefik.http.routers.platform.priority=20
      - traefik.http.routers.platform.service=platform
      - traefik.http.routers.platform-onboarding.rule=PathPrefix(`/v1/onboarding`)
      - traefik.http.routers.platform-onboarding.entrypoints=web
      - traefik.http.routers.platform-onboarding.priority=20
      - traefik.http.routers.platform-onboarding.service=platform
      - traefik.http.routers.platform-news.rule=PathPrefix(`/v1/news`)
      - traefik.http.routers.platform-news.entrypoints=web
      - traefik.http.routers.platform-news.priority=20
      - traefik.http.routers.platform-news.service=platform
      - traefik.http.routers.platform-organisation.rule=PathPrefix(`/v1/organisation`)
      - traefik.http.routers.platform-organisation.entrypoints=web
      - traefik.http.routers.platform-organisation.priority=20
      - traefik.http.routers.platform-organisation.service=platform
      - traefik.http.routers.platform-controls.rule=PathPrefix(`/v1/controls`)
      - traefik.http.routers.platform-controls.entrypoints=web
      - traefik.http.routers.platform-controls.priority=20
      - traefik.http.routers.platform-controls.service=platform
      - traefik.http.routers.platform-privacy.rule=PathPrefix(`/v1/privacy`)
      - traefik.http.routers.platform-privacy.entrypoints=web
      - traefik.http.routers.platform-privacy.priority=20
      - traefik.http.routers.platform-privacy.service=platform
      - traefik.http.routers.platform-billing.rule=PathPrefix(`/v1/billing`)
      - traefik.http.routers.platform-billing.entrypoints=web
      - traefik.http.routers.platform-billing.priority=20
      - traefik.http.routers.platform-billing.service=platform
    networks:
      - facinect_internal
    restart: unless-stopped

  app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
    container_name: facinect-app
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_IDENTITY_DB}
      DB_USER: ${POSTGRES_IDENTITY_USER}
      DB_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      APP_SERVICE_KEY: ${APP_SERVICE_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      PAYGATEWAY_URL: ${PAYGATEWAY_URL:-http://paygateway:8080}
      PAYGATEWAY_SERVICE_KEY: ${PAYGATEWAY_SERVICE_KEY:-}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cloud.facinect.com}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/app/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.services.app.loadbalancer.server.port=8080
      - traefik.http.routers.app.rule=PathPrefix(`/v1/app`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.routers.app.priority=20
      - traefik.http.routers.app.service=app
    networks:
      - facinect_internal
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: facinect-web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=10
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks:
      - facinect_internal
    restart: unless-stopped

networks:
  facinect_internal:
    name: facinect_internal
    driver: bridge

volumes:
  postgres_data:
    name: facinect_postgres_data
  redis_data:
    name: facinect_redis_data
